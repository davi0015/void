# Correctness gate for pull requests: dependency install, unit tests, hygiene,
# and a typecheck on Linux. Runs on PRs, on pushes to main (which is what seeds
# the cache PRs restore), and manually. It produces no artifacts.
#
# Measured on run 44481094052 (428 s), the shape this file started from:
#
#   Install dependencies   npm ci                198 s   46%
#   Compile workbench      gulp compile          156 s   36%
#   Install system deps    apt-get                19 s
#   Unit tests                                     13 s
#   Build React bundles                            10 s
#   Hygiene                                         1 s
#
# The `npm ci` was not a missing cache action — there is one — but a scoping
# mistake: GitHub scopes a cache to the ref that saved it, and a `pull_request`
# run saves under `refs/pull/<n>/merge`. With no `push` trigger this workflow
# never ran on `main`, so there was no main-scoped cache for a PR to restore and
# every PR paid the full install. The `push` trigger below is the fix, and it
# also gives main the same checks after a merge.
#
# The compile is split in two, in parallel:
#
#   - `Tests + hygiene` transpiles with SWC (`transpile-client-esbuild`, ~30 s
#     measured locally; `gulp compile` was 156 s) and runs the node tier. SWC
#     does not typecheck.
#   - `Typecheck` runs the project's own `tsc --noEmit --skipLibCheck` (~82 s on
#     CI). It builds the React bundles first so `./react/out/*` imports resolve,
#     and compiles the built-in extensions only when the PR touches
#     `extensions/` — that is a bundling check, not a typecheck, because those
#     builds are esbuild.
#
# Both jobs are independent and both can be required; the wall clock is the
# slower one. Requiring only `Tests + hygiene` gives the fastest gate and leaves
# the typecheck visible but advisory.
#
# The job that used to be called `Compile + hygiene (Linux)` is now
# `Tests + hygiene (Linux)`; the typecheck is its own job. Branch protection
# names checks, so that rename has to be reflected there once.
#
# `node_modules` is checked against `build/npm/dirs.js` rather than trusted: a
# cache that silently misses a directory produces a compile failure that reads
# as a source error. The first version of this workflow cached six globs and
# missed five directories the postinstall populates; restoring it skipped
# `npm ci` and the compile died on two missing modules plus three implicit-any
# errors in callbacks whose types came from them. A forgotten path now costs a
# slow run instead of a broken one.

name: PR check

on:
  pull_request:
    branches: [main]
  # Seeds the node_modules cache for PRs and checks main after a merge.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-22.04
    outputs:
      run: ${{ steps.scope.outputs.run }}
      compile: ${{ steps.scope.outputs.compile }}
      extensions: ${{ steps.scope.outputs.extensions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fails open: if the diff cannot be computed the answer is "run
      # everything", because a wrongly skipped check is worse than a slow one.
      - name: Decide what this PR can affect
        id: scope
        run: |
          set -uo pipefail
          run=true
          compile=true
          extensions=false
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            if git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}" 2>/dev/null; then
              changed="$(git diff --name-only FETCH_HEAD HEAD 2>/dev/null || true)"
              if [ -n "${changed}" ]; then
                echo "Changed files:"; printf '%s\n' "${changed}"
                # Documentation is excluded from every hygiene filter and is not
                # a compile input, so a docs-only PR has nothing here to check.
                non_docs="$(printf '%s\n' "${changed}" | grep -vE '(^docs/|\.md$)' || true)"
                if [ -z "${non_docs}" ]; then
                  run=false
                  compile=false
                else
                  if printf '%s\n' "${non_docs}" | grep -qE '^extensions/'; then
                    extensions=true
                  fi
                  # `test/void/*.mjs` is run by node, never compiled — but it is
                  # linted by hygiene, so the install still happens.
                  non_docs="$(printf '%s\n' "${non_docs}" | grep -vE '^test/void/' || true)"
                  [ -z "${non_docs}" ] && compile=false
                fi
              fi
            fi
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "compile=${compile}" >> "$GITHUB_OUTPUT"
          echo "extensions=${extensions}" >> "$GITHUB_OUTPUT"
          {
            echo "### PR check scope"
            echo ""
            echo "- install + hygiene: \`${run}\`"
            echo "- unit tests: \`${compile}\`"
            echo "- typecheck + built-in extensions: \`${compile}\` (extensions: \`${extensions}\`)"
            if [ "${compile}" = "false" ]; then
              echo ""
              echo "No file the compile reads changed, so tests and typecheck were skipped. The jobs still report success — skipping them outright would leave required checks pending."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests + hygiene (Linux)
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install node modules
        uses: ./.github/actions/install-modules

      # Cheap, and it keeps `out/` complete: the workbench imports
      # `./react/out/*`, which is gitignored. The node tier does not need it
      # today, but a test that reaches a UI module would fail on a missing
      # bundle rather than on its own assertion.
      - name: Build React bundles
        if: needs.scope.outputs.compile == 'true'
        run: npm run buildreact

      # SWC transpile, not `gulp compile`: the node tier reads `out/`, and the
      # typecheck is its own job. ~30 s against 156 s.
      - name: Transpile workbench
        if: needs.scope.outputs.compile == 'true'
        run: node ./node_modules/gulp/bin/gulp.js transpile-client-esbuild

      # Gated on the transpile: `test-node` globs `out/**/test/**/*.test.js`, so
      # against a runner that never transpiled it finds no files and reports zero
      # tests passing. A required check that goes green having tested nothing is
      # worse than one that does not run.
      - name: Unit tests
        if: needs.scope.outputs.compile == 'true'
        run: npm run test-node

      - name: Hygiene
        run: node build/hygiene.js

  typecheck:
    name: Typecheck (Linux)
    needs: scope
    if: needs.scope.outputs.compile == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install node modules
        uses: ./.github/actions/install-modules

      # The workbench imports `./react/out/*`, which is gitignored; without the
      # bundles the imports do not resolve and tsc reports them as errors.
      - name: Build React bundles
        run: npm run buildreact

      # Full-project tsc needs more than node's ~4GB default heap.
      # --skipLibCheck silences pre-existing errors in third-party .d.ts files
      # (e.g. linkedom); src/ is still fully checked.
      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npx tsc -p src/tsconfig.json --noEmit --skipLibCheck

      # Built-in extensions are bundled with esbuild rather than typechecked, so
      # this is a bundling check. Scoped to PRs that touch them.
      - name: Compile built-in extensions
        if: needs.scope.outputs.extensions == 'true'
        run: node ./node_modules/gulp/bin/gulp.js compile-extensions compile-extension-media
