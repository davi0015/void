# Build Void distributables for macOS (arm64) and Windows (x64).
#
# COST — this repo is public, so GitHub-hosted runners are free and
# unlimited (minutes and artifact storage). Even so, this workflow has NO
# push/pull_request trigger — a full distro build is ~20-40 min
# wall-clock per platform, so it runs only when you start it by hand
# (Actions tab → Run workflow) or push a version tag (v*).
# Artifacts auto-expire after 14 days to keep storage tidy.
#
# Signing: builds are UNSIGNED (no Apple cert / Windows cert in CI).
# macOS Gatekeeper will block the app on first launch — right-click → Open,
# or `xattr -cr Void.app`. The Windows user-setup installer works as-is
# (SmartScreen will show an "unknown publisher" prompt).

name: Build distributables

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac-arm64:
    name: macOS arm64
    # macos-14 is Apple Silicon — required for a darwin-arm64 build.
    runs-on: macos-14
    timeout-minutes: 120
    # Authenticates api.github.com calls made by postinstall downloaders
    # (@vscode/ripgrep etc.) — anonymous requests from shared runner IPs
    # hit rate limits (403) otherwise.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Void-specific: the chat UI bundle is gitignored and must be built
      # before the workbench compile picks it up.
      - name: Build React bundles
        run: npm run buildreact

      # Compiles the client + extensions and packages Void.app into
      # ../VSCode-darwin-arm64 (sibling of the checkout, per build scripts).
      - name: Package macOS app
        run: node --max-old-space-size=8192 ./node_modules/gulp/bin/gulp.js vscode-darwin-arm64

      - name: Zip app
        run: |
          APP=$(ls -d ../VSCode-darwin-arm64/*.app | head -1)
          echo "Zipping $APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Void-mac-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Void-mac-arm64
          path: Void-mac-arm64.zip
          retention-days: 14

  build-win-x64:
    name: Windows x64
    # Pinned to 2022: node-gyp (native modules in `npm ci`) needs a full
    # Visual Studio install, which the windows-latest (2025) image no
    # longer provides in a detectable form.
    runs-on: windows-2022
    timeout-minutes: 120
    # Same api.github.com rate-limit fix as the mac job.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Void-specific: see mac job.
      - name: Build React bundles
        run: npm run buildreact

      # Compiles the client + extensions and stages the app into
      # ../VSCode-win32-x64 (sibling of the checkout, per build scripts).
      - name: Package Windows app
        run: node --max-old-space-size=8192 ./node_modules/gulp/bin/gulp.js vscode-win32-x64

      # Stages inno_updater.exe + vcruntime into VSCode-win32-x64/tools —
      # required by code.iss, but not part of the package task itself.
      - name: Stage updater tools
        run: node --max-old-space-size=8192 ./node_modules/gulp/bin/gulp.js vscode-win32-x64-inno-updater

      # Builds the per-user Setup exe via Inno Setup into
      # .build/win32-x64/user-setup (no code signing — expect a
      # SmartScreen "unknown publisher" prompt on install).
      - name: Build user installer
        run: node --max-old-space-size=8192 ./node_modules/gulp/bin/gulp.js vscode-win32-x64-user-setup

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Void-win-x64-setup
          path: .build/win32-x64/user-setup/*.exe
          retention-days: 14
